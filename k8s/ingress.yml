apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowpay-core
  namespace: flowpay
  labels:
    app.kubernetes.io/name: flowpay-core
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: flowpay
  annotations:
    # Ingress controller
    kubernetes.io/ingress.class: nginx
    # TLS
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # SSL redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.flowpay.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Request-ID, X-Idempotency-Key"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.flowpay.com
      secretName: flowpay-tls-cert
  rules:
    - host: api.flowpay.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: flowpay-core
                port:
                  name: http
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: flowpay-core
                port:
                  name: http
          - path: /actuator/prometheus
            pathType: Exact
            backend:
              service:
                name: flowpay-core
                port:
                  name: http
