server:
  port: 0

spring:
  application:
    name: flowpay-core-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: true
    show-sql: false

  flyway:
    enabled: false

  cache:
    type: none

  data:
    redis:
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.flowpay.kafka.dto.PaymentEvent

flowpay:
  payment:
    min-amount: 0.01
    max-amount: 1000000.00
    daily-limit-multiplier: 1.0
  kafka:
    topics:
      payment-initiated: payment-initiated
      payment-completed: payment-completed
      payment-failed: payment-failed
      audit-events: audit-events
    consumer:
      concurrency: 1
      retry:
        max-attempts: 3
        backoff-interval: 100
  cache:
    ttl:
      account-balance: 60
      user-profile: 120
      transaction-status: 30
  rate-limiter:
    enabled: false
    default-limit: 10
    default-window-seconds: 60
  distributed-lock:
    enabled: false
    wait-time: 2000
    lease-time: 10000
  security:
    jwt:
      secret: dGVzdHNlY3JldGtleWZvcmZsb3dwYXlqd3R0b2tlbnNpZ25pbmdwdXJwb3Nlc29ubHl0ZXN0aW5n
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
      issuer: flowpay-core-test

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: WARN
    com.flowpay: INFO
    org.springframework.kafka: INFO
