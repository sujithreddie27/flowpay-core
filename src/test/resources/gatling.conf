gatling {
  core {
    outputDirectoryBaseName = "flowpay-loadtest"
    runDescription = "FlowPay Payment Processing Load Test"
    encoding = "utf-8"
    simulationClass = "com.flowpay.loadtest.PaymentLoadSimulation"
  }
  http {
    enableGA = true
  }
  data {
    writers = [console, file]
    console {
      light = false
      writePeriod = 5
    }
  }
  charting {
    noReports = false
    indicators {
      lowerBound = 200
      higherBound = 1000
      percentile1 = 50
      percentile2 = 75
      percentile3 = 95
      percentile4 = 99
    }
  }
}
