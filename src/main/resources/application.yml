server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: flowpay-core

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowpay}?reWriteBatchedInserts=true
    username: ${DB_USERNAME:flowpay}
    password: ${DB_PASSWORD:flowpay}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
      pool-name: FlowPayHikariPool
      register-mbeans: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: ${HIBERNATE_STATS:false}
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 2048

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.flowpay.*
        spring.json.value.default.type: com.flowpay.kafka.dto.PaymentEvent
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispass}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: "flowpay:"

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  lifecycle:
    timeout-per-shutdown-phase: 30s

flowpay:
  payment:
    min-amount: 0.01
    max-amount: 1000000.00
    daily-limit-multiplier: 1.0
  async:
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:8}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:32}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:500}
    batch-core-pool-size: ${BATCH_CORE_POOL_SIZE:4}
    batch-max-pool-size: ${BATCH_MAX_POOL_SIZE:16}
    batch-queue-capacity: ${BATCH_QUEUE_CAPACITY:200}
  kafka:
    topics:
      payment-initiated: payment-initiated
      payment-completed: payment-completed
      payment-failed: payment-failed
      audit-events: audit-events
    consumer:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
      retry:
        max-attempts: 3
        backoff-interval: 1000
  cache:
    ttl:
      account-balance: 300
      user-profile: 600
      transaction-status: 120
  rate-limiter:
    enabled: true
    default-limit: 100
    default-window-seconds: 60
  distributed-lock:
    wait-time: 5000
    lease-time: 30000
  notification:
    email:
      from: ${NOTIFICATION_EMAIL_FROM:noreply@flowpay.com}
      enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    webhook:
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      retry-interval-ms: 60000
      max-attempts: 5
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBmbG93cGF5IGp3dCBzaWduaW5nIHB1cnBvc2VzIG9ubHk=}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
      issuer: flowpay-core
  payment-gateway:
    name: External Payment Gateway
    health-url: ${PAYMENT_GATEWAY_HEALTH_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,hikaricp
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    enable:
      hikaricp: true
      jvm: true
      process: true
      system: true
      jdbc: true
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        payment.processing.duration.seconds: true
        payment.initiate.duration: true
        payment.retry.duration: true
        payment.reverse.duration: true
        payment.batch.duration: true
        account.credit.duration: true
        account.debit.duration: true
        http.server.requests: true
      percentiles:
        payment.processing.duration.seconds: 0.5, 0.75, 0.95, 0.99
        payment.initiate.duration: 0.5, 0.75, 0.95, 0.99
        payment.batch.duration: 0.5, 0.75, 0.95, 0.99
        http.server.requests: 0.5, 0.75, 0.95, 0.99
      slo:
        payment.processing.duration.seconds: 100ms, 250ms, 500ms, 1s, 2s, 5s
        http.server.requests: 50ms, 100ms, 250ms, 500ms, 1s, 2s
    tags:
      application: flowpay-core
      environment: ${ENVIRONMENT:dev}
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    defaults:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO
    com.flowpay: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
