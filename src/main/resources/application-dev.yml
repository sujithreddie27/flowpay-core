server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/flowpay_dev
    username: flowpay
    password: flowpay
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        linger.ms: 0

logging:
  level:
    root: INFO
    com.flowpay: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
